name: Publish Android client API

on:
  workflow_dispatch:
    inputs:
      version:
        description: Android artifact version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate version
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Build client AAR
        run: |
          ./gradlew --no-daemon :connect-api:lintRelease :connect-api:assembleRelease
          install -D connect-api/build/outputs/aar/connect-api-release.aar "$RUNNER_TEMP/release/connect-api-$VERSION.aar"
          cp LICENSE "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: android-aar
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-aar
      - run: gh release create "android-v$VERSION" "connect-api-$VERSION.aar" LICENSE --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OpenZilo Connect Android API $VERSION" --notes "Binder client built from $GITHUB_SHA. Consumers must include org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2 and install a compatible OpenZilo Connect app."
